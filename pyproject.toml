[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiendahogar-agent"
version = "0.1.0"
description = "Minimal customer-support agent for TiendaHogar: RAG, one order-status tool, deterministic guardrails."
requires-python = ">=3.10"
dependencies = [
    "openai>=1.60",
    "fastembed>=0.5",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tiendahogar = ["policies/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not live'"
markers = [
    "live: scenarios that call the real OpenAI API (need OPENAI_API_KEY); run with: pytest -m live",
]
