[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiendahogar-agent"
version = "0.1.0"
description = "Minimal customer-support agent for TiendaHogar: RAG, one order-status tool, deterministic guardrails."
requires-python = ">=3.11"
# Lower bounds are the versions this was developed and tested with.
dependencies = [
    "openai>=3.24,<4",
    "fastembed>=0.8.1,<0.9",
    "numpy>=2.0,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tiendahogar = ["policies/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not live'"
markers = [
    "live: scenarios that call the real OpenAI API (need OPENAI_API_KEY); run with: pytest -m live",
]
